    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --bg-light: #f8fafc;
        }

        @media (max-width: 991.98px) {
            .navbar-collapse {
                background: #ffffff;
                padding: 1rem;
                border-radius: 12px;
                margin-top: 1rem;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            }
        }

        /* --- Responsive Hero Section --- */
        @media (max-width: 768px) {
            .hero-section {
                padding: 60px 0;
                text-align: center;
            }

            .hero-title {
                font-size: 2.5rem;
                /* Smaller font for mobile */
            }

            .hero-text {
                font-size: 1.1rem;
            }

            .hero-img {
                max-width: 90%;
                /* Larger image relative to screen on mobile */
                margin-top: 3rem;
            }

            .d-flex {
                justify-content: center;
                /* Center buttons on mobile */
            }
        }

        /* --- Responsive Content Cards --- */
        @media (max-width: 576px) {
            .content-card {
                padding: 1.5rem;
                /* Less padding on small phones */
            }

            .hero-title {
                font-size: 2.2rem;
            }
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* --- Navbar Styling --- */
        .navbar {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 0;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary-color) !important;
            letter-spacing: -1px;
        }

        .nav-link {
            font-weight: 600;
            color: var(--text-dark) !important;
            margin: 0 10px;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary-color) !important;
        }
    </style>
</head>
