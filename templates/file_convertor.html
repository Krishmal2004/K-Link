<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #7c3aed;
            --text-dark: #0f172a;
            --text-light: #64748b;
            --bg-light: #f8fafc;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* --- Original Navbar Styling preserved --- */
        .navbar {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
            padding: 1rem 0;
        }

        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--primary-color) !important;
            letter-spacing: -1px;
        }

        .nav-link {
            font-weight: 600;
            color: var(--text-dark) !important;
            margin: 0 10px;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary-color) !important;
        }

        /* --- New Responsive Converter Styling --- */
        .file-converter-section {
            padding: 80px 0;
            display: flex;
            justify-content: center;
        }

        .border-box {
            background: #fff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.05);
            max-width: 550px;
            width: 100%;
            border: 1px solid #edf2f7;
        }

        .border-box h2 {
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }

        .btn-primary {
            background: var(--primary-color);
            border: none;
            padding: 12px 25px;
            font-weight: 600;
            border-radius: 10px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .file-converter-section { padding: 40px 15px; }
            .border-box { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">K-Link</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link " href="{{ url_for('index') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('translator') }}">Translator</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('converter') }}">Converter</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="file-converter-section">
        <div class="border-box">
            <h2>File Converter</h2>
            <form action="{{ url_for('convert') }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="inputFile" class="form-label fw-bold">Upload File</label>
                    <input class="form-control" type="file" id="inputFile" name="file" required>
                </div>
                <div class="mb-4">
                    <label for="target_format" class="form-label fw-bold">Select Output Format</label>
                    <select class="form-select" id="target_format" name="target_format" required>
                        <option value="docx">PDF to DOCX</option>
                        <option value="xlsx">DOCX to Excel (Tables)</option>
                        <option value="pdf">Image to PDF</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Convert & Download</button>
            </form>
        </div>
    </div>
</body>
</html>
