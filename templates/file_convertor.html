<div class="card p-5 shadow-sm border-0 rounded-4">
    <h2 class="text-center mb-4">Universal Converter</h2>
    <form action="/convert" method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Upload File</label>
            <input type="file" name="file" class="form-control" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Convert To:</label>
            <select name="target_format" class="form-select">
                <option value="docx">Word (.docx)</option>
                <option value="xlsx">Excel Table (.xlsx)</option>
                <option value="pdf">PDF (.pdf)</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Convert Now</button>
    </form>
</div>
